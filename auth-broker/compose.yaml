services:
  auth-broker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_SITE_URL: "${SITE_URL:-https://nexora-git.invalid}"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: "${SITE_URL:-https://nexora-git.invalid}"
      NEXORA_WEB_RELEASE_METADATA: /releases/current/latest.json
    ports:
      - "127.0.0.1:${WEB_PORT:-18081}:3000"
    volumes:
      - /var/lib/nexora-git/web/releases:/releases:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
