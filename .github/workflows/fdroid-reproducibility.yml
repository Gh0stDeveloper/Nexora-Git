name: F-Droid Reproducibility

on:
  push:
    branches:
      - main
      - "phase-s/**"
    paths:
      - ".gitmodules"
      - "app/**"
      - "native/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "metadata/com.nexora.git.yml"
      - ".github/workflows/fdroid-reproducibility.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "app/**"
      - "native/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "metadata/com.nexora.git.yml"
      - ".github/workflows/fdroid-reproducibility.yml"

permissions:
  contents: read

concurrency:
  group: fdroid-reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fdroid-native:
    name: Build from pinned native source submodules
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXORA_GITHUB_CLIENT_ID: Iv1.NexoraFdroidBuild
      NEXORA_AUTH_BROKER_BASE_URL: https://fdroid-build.example
      NEXORA_GITHUB_CALLBACK_URL: https://fdroid-build.example/oauth/callback

    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify pinned native source revisions
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "native/git/vendor/libgit2 49e408b3208bc3093757a1c2db938d3590f3f412"
            "native/git/vendor/mbedtls 068ff080b369adfac81509f9b57b2afabaf82dc5"
            "native/git/vendor/tree-sitter 752c612a1359f00e4c113593837a0c1e880214e3"
            "native/git/vendor/tree-sitter-kotlin 1852ea17b7f60fb3f9d84e0b1555d56b46b39fb1"
            "native/git/vendor/tree-sitter-java e10607b45ff745f5f876bfa3e94fbcc6b44bdc11"
            "native/git/vendor/tree-sitter-json 254c42a6476413b776221e03982ac8ae159eeb72"
            "native/git/vendor/tree-sitter-python 26855eabccb19c6abf499fbc5b8dc7cc9ab8bc64"
            "native/git/vendor/tree-sitter-javascript 58404d8cf191d69f2674a8fd507bd5776f46cb11"
            "native/git/vendor/tree-sitter-typescript 75b3874edb2dc714fb1fd77a32013d0f8699989f"
          )
          for item in "${expected[@]}"; do
            path="${item%% *}"
            sha="${item##* }"
            actual="$(git -C "$path" rev-parse HEAD)"
            [[ "$actual" == "$sha" ]] || {
              echo "Unexpected submodule revision for $path: $actual" >&2
              exit 1
            }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3             "platform-tools"             "platforms;android-37.0"             "build-tools;37.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build release with disconnected native FetchContent
        shell: bash
        run: |
          ./gradlew --no-daemon             -Pnexora.native.requireVendoredSources=true             :app:assembleRelease             :app:lintRelease

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -s "$APK" ]]
          sha256sum "$APK"
