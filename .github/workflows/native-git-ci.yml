name: Native Git CI

on:
  push:
    branches:
      - main
      - "phase-*"
      - "phase-s/**"
    paths:
      - "native/git/**"
      - "native/config/**"
      - ".github/workflows/native-git-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "native/git/**"
      - "native/config/**"
      - ".github/workflows/native-git-ci.yml"

permissions:
  contents: read

concurrency:
  group: native-git-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test libgit2 core
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Configure
        shell: bash
        env:
          NEXORA_GITHUB_CLIENT_ID: Iv1.NexoraNativeConfigTest
          NEXORA_AUTH_BROKER_BASE_URL: https://native-config.example
          NEXORA_GITHUB_CALLBACK_URL: https://native-config.example/oauth/callback
        run: |
          cmake \
            -S native/git \
            -B build/native-git \
            -G Ninja \
            -DNEXORA_BUILD_NATIVE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build/native-git --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build/native-git --output-on-failure


  sanitizers:
    name: ASan and UBSan native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Clang and native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake

      - name: Configure sanitizer build
        shell: bash
        env:
          CC: clang
          CXX: clang++
          NEXORA_GITHUB_CLIENT_ID: Iv1.NexoraSanitizer
          NEXORA_AUTH_BROKER_BASE_URL: https://native-sanitizer.example
          NEXORA_GITHUB_CALLBACK_URL: https://native-sanitizer.example/oauth/callback
        run: |
          cmake \
            -S native/git \
            -B build/native-sanitizers \
            -G Ninja \
            -DNEXORA_BUILD_NATIVE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitizer targets
        run: cmake --build build/native-sanitizers --parallel 2

      - name: Run sanitizer tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/native-sanitizers --output-on-failure
