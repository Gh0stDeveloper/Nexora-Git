name: Stable Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish stable release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    env:
      NEXORA_GITHUB_CLIENT_ID: ${{ secrets.NEXORA_GITHUB_CLIENT_ID }}
      NEXORA_AUTH_BROKER_BASE_URL: ${{ secrets.NEXORA_AUTH_BROKER_BASE_URL }}
      NEXORA_GITHUB_CALLBACK_URL: ${{ secrets.NEXORA_GITHUB_CALLBACK_URL }}
      NEXORA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXORA_SIGNING_STORE_PASSWORD }}
      NEXORA_SIGNING_KEY_ALIAS: ${{ secrets.NEXORA_SIGNING_KEY_ALIAS }}
      NEXORA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXORA_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate release policy and tag
        shell: bash
        run: |
          bash scripts/ci/validate-production.sh
          bash scripts/ci/validate-release-tag.sh "$GITHUB_REF_NAME"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate production configuration
        shell: bash
        env:
          NEXORA_SIGNING_KEYSTORE_BASE64: ${{ secrets.NEXORA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            NEXORA_GITHUB_CLIENT_ID
            NEXORA_AUTH_BROKER_BASE_URL
            NEXORA_GITHUB_CALLBACK_URL
            NEXORA_SIGNING_KEYSTORE_BASE64
            NEXORA_SIGNING_STORE_PASSWORD
            NEXORA_SIGNING_KEY_ALIAS
            NEXORA_SIGNING_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || {
              echo "Missing required production secret: $name"
              exit 1
            }
          done

          case "$NEXORA_AUTH_BROKER_BASE_URL" in
            https://*) ;;
            *) echo "Auth Broker must use HTTPS."; exit 1 ;;
          esac

          case "$NEXORA_GITHUB_CALLBACK_URL" in
            https://*) ;;
            *) echo "GitHub callback must use HTTPS."; exit 1 ;;
          esac

          keystore="$RUNNER_TEMP/nexora-git-release.jks"
          printf '%s' "$NEXORA_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "NEXORA_SIGNING_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build signed release
        shell: bash
        run: |
          ./gradlew --no-daemon \
            :app:assembleRelease \
            :app:bundleRelease \
            :app:testDebugUnitTest \
            :app:lintRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Enforce artifact budgets
        shell: bash
        run: bash scripts/ci/check-artifact-size.sh

      - name: Stage release artifacts
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -type f -print -quit)"
          cp "$APK" "dist/NexoraGit-$VERSION.apk"
          cp "$AAB" "dist/NexoraGit-$VERSION.aab"

          SYMBOLS="$(find app/build/outputs/native-debug-symbols/release -maxdepth 1 -name '*.zip' -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$SYMBOLS" ]]; then
            cp "$SYMBOLS" "dist/NexoraGit-$VERSION-native-symbols.zip"
          fi

          (
            cd dist
            sha256sum NexoraGit-* > SHA256SUMS.txt
          )

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NexoraGit-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "Nexora Git $VERSION" \
              --generate-notes
          fi
