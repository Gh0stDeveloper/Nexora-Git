# Optional validation of the maintainer's manual Android captures.
# Does not run during normal CI and never creates, replaces or commits images.
name: Marketing Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-manual-captures:
    name: Validate owner-provided screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate eight final Android screenshots
        run: python3 scripts/ci/validate-s16-discoverability.py --require-screenshots

      - name: Publish approved screenshot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NexoraGit-owner-approved-screenshots
          path: docs/assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
