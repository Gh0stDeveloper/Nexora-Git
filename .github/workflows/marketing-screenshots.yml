name: Marketing Screenshots

on:
  push:
    branches:
      - phase-s/p2-s16-discoverability
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/java/com/nexora/git/marketing/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/marketing-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: marketing-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture real Android UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXORA_GITHUB_CLIENT_ID: Iv1.NexoraScreenshots
      NEXORA_AUTH_BROKER_BASE_URL: https://screenshots.example
      NEXORA_GITHUB_CALLBACK_URL: https://screenshots.example/oauth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Capture screenshots on Pixel 6
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            ./gradlew --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.nexora.git.marketing.MarketingScreenshotTest
            rm -rf docs/assets/screenshots
            mkdir -p docs/assets/screenshots
            adb pull /sdcard/Android/data/com.nexora.git/files/screenshots/. docs/assets/screenshots/
            test -s docs/assets/screenshots/home-light.png
            test -s docs/assets/screenshots/home-dark.png
            test -s docs/assets/screenshots/home-amoled.png
            test -s docs/assets/screenshots/repository-detail.png
            test -s docs/assets/screenshots/editor.png
            test -s docs/assets/screenshots/git-workbench.png
            test -s docs/assets/screenshots/pull-request.png
            test -s docs/assets/screenshots/actions.png

      - name: Version screenshots
        shell: bash
        run: |
          set -euo pipefail
          git add docs/assets/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already match the current UI."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(screenshots): refresh real Android UI captures [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NexoraGit-marketing-screenshots
          path: docs/assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
