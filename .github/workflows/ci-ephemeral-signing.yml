name: Ephemeral Signed Android CI

# Untrusted pull requests receive no production keys. Every invocation uses a
# short-lived self-signed test key and an isolated com.nexora.git.ci package.
on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "buildSrc/**"
      - "native/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ci-ephemeral-signing.yml"
      - "scripts/ci/verify-release-signing.sh"
      - "scripts/ci/verify-production-signing-pin.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephemeral-signing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-smoke:
    name: Ephemeral release APK/AAB parity (not for distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      # These are inert CI-only configuration sentinels, never a real OAuth app.
      NEXORA_GITHUB_CLIENT_ID: Iv1.NexoraEphemeralCiOnly
      NEXORA_AUTH_BROKER_BASE_URL: https://ci-signing.invalid
      NEXORA_GITHUB_CALLBACK_URL: https://ci-signing.invalid/oauth/callback
      NEXORA_CI_EPHEMERAL_SIGNING: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37.0
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Generate isolated temporary PKCS12 signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/nexora-ephemeral-${GITHUB_RUN_ID}.p12"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt \
            -alias nexora-ci-ephemeral \
            -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
            -validity 7 -storetype PKCS12 \
            -dname "CN=Nexora Git Ephemeral CI,OU=Nonproduction,O=Nexora" \
            -keystore "$keyfile" -storepass "$password" -keypass "$password"
          test -s "$keyfile"
          {
            printf 'NEXORA_SIGNING_STORE_FILE=%s\n' "$keyfile"
            printf 'NEXORA_SIGNING_STORE_PASSWORD=%s\n' "$password"
            printf 'NEXORA_SIGNING_KEY_ALIAS=nexora-ci-ephemeral\n'
            printf 'NEXORA_SIGNING_KEY_PASSWORD=%s\n' "$password"
          } >> "$GITHUB_ENV"
          unset password

      - name: Build signed CI-only APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:assembleRelease \
            :app:bundleRelease \
            :app:testDebugUnitTest \
            :app:lintRelease

      - name: Verify signing parity and isolated package identity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/verify-release-signing.sh
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          aapt="$sdk/build-tools/37.0.0/aapt"
          test -x "$aapt"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$apk"
          actual="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$actual" = "com.nexora.git.ci" || {
            echo "::error::Ephemeral APK must have com.nexora.git.ci package ID, got '$actual'."
            exit 1
          }
          echo "Ephemeral APK and AAB signing parity and isolated package ID verified."

      - name: Test trusted signer pin against matching and mismatched fingerprints
        shell: bash
        run: |
          set -euo pipefail
          actual="$(keytool -list -v \
            -alias "$NEXORA_SIGNING_KEY_ALIAS" \
            -keystore "$NEXORA_SIGNING_STORE_FILE" \
            -storepass "$NEXORA_SIGNING_STORE_PASSWORD" 2>/dev/null |
            awk -F': ' '/SHA256:/ { print $2; exit }')"
          test -n "$actual"
          NEXORA_EXPECTED_SIGNER_SHA256="$actual" bash scripts/ci/verify-production-signing-pin.sh
          wrong="$(printf '%064d' 0)"
          if NEXORA_EXPECTED_SIGNER_SHA256="$wrong" \
            bash scripts/ci/verify-production-signing-pin.sh >/dev/null 2>&1; then
            echo "::error::Signing pin accepted a mismatched certificate."
            exit 1
          fi

      - name: Stage explicitly nonproduction test artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -s "$apk" && test -s "$aab"
          cp "$apk" dist/NexoraGit-CI-ONLY.apk
          cp "$aab" dist/NexoraGit-CI-ONLY.aab
          expected="$(keytool -list -v \
            -keystore "$NEXORA_SIGNING_STORE_FILE" \
            -storepass "$NEXORA_SIGNING_STORE_PASSWORD" \
            -alias "$NEXORA_SIGNING_KEY_ALIAS" 2>/dev/null |
            awk -F': ' '/SHA256:/ { print toupper($2); exit }')"
          test -n "$expected"
          {
            echo "NONPRODUCTION EPHEMERAL SIGNING — DO NOT DISTRIBUTE AS NEXORA GIT"
            echo "Package: com.nexora.git.ci"
            echo "Version: 1.0.0-ci"
            echo "Source commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Temporary signing cert SHA-256: $expected"
            echo "The key is discarded after this CI job; each new run has a different signer."
            echo "These binaries cannot update production com.nexora.git."
            echo "No real GitHub authentication or production domain is configured."
          } > dist/NONPRODUCTION-READ-ME.txt
          (
            cd dist
            sha256sum NexoraGit-CI-ONLY.apk NexoraGit-CI-ONLY.aab NONPRODUCTION-READ-ME.txt > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Upload temporary diagnostic builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NexoraGit-EPHEMERAL-NOT-FOR-PRODUCTION-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
