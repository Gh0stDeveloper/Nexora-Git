name: Dependency Review

on:
  push:
    branches:
      - main
      - "phase-s/**"
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan target branch dependencies
        id: scan-old
        shell: bash
        run: git checkout "${GITHUB_BASE_REF}"

      - name: OSV scan target branch
        id: osv-old
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --recursive
            ./

      - name: Restore pull request head
        shell: bash
        run: git checkout -f "${GITHUB_SHA}"

      - name: OSV scan pull request
        id: osv-new
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --recursive
            ./

      - name: Require completed vulnerability scans
        if: ${{ steps.osv-old.outcome == 'failure' || steps.osv-new.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          status=0

          if [[ "${{ steps.osv-old.outcome }}" == "failure" && ! -s old-results.json ]]; then
            echo "::error::OSV target-branch scan failed without producing results."
            status=1
          fi

          if [[ "${{ steps.osv-new.outcome }}" == "failure" && ! -s new-results.json ]]; then
            echo "::error::OSV pull-request scan failed without producing results."
            status=1
          fi

          exit "$status"

      - name: Reject newly introduced vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          scan-args: |-
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true


  dependency-scan-main:
    if: github.event_name == 'push'
    name: Scan full dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Scan all known dependency vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./
