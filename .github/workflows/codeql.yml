name: CodeQL

on:
  push:
    branches:
      - main
      - "phase-r-*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Manual builds are required for the Android/Kotlin project. Disable
      # CodeQL's overlay optimization explicitly so the action does not emit
      # a fallback warning while preserving full traced compilation analysis.
      CODEQL_OVERLAY_DATABASE_MODE: none

    steps:
      - name: Configure Git default branch
        shell: bash
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Kotlin/Java for CodeQL
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --rerun-tasks \
            :app:clean \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
