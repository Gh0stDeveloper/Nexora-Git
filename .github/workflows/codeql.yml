name: CodeQL

on:
  push:
    branches:
      - main
      - "phase-r-*"
      - "phase-s/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODEQL_OVERLAY_DATABASE_MODE: none
      NEXORA_GITHUB_CLIENT_ID: Iv1.NexoraCodeQL
      NEXORA_AUTH_BROKER_BASE_URL: https://codeql.example
      NEXORA_GITHUB_CALLBACK_URL: https://codeql.example/oauth/callback

    steps:
      - name: Configure Git default branch
        shell: bash
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37.0 (verified, retry transient downloads)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          # Check the actual required files, not just sdkmanager's exit code.
          # Google SDK mirrors occasionally return truncated CMake zip files.
          sdk_ready() {
            test -f "$SDK_ROOT/platform-tools/source.properties" &&
            test -f "$SDK_ROOT/platforms/android-37.0/source.properties" &&
            test -f "$SDK_ROOT/build-tools/37.0.0/source.properties" &&
            test -x "$SDK_ROOT/build-tools/37.0.0/aapt2" &&
            test -f "$SDK_ROOT/ndk/27.2.12479018/source.properties" &&
            test -f "$SDK_ROOT/cmake/3.22.1/source.properties" &&
            test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if sdk_ready; then
            echo "Required Android SDK components already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "::group::Android SDK download attempt $attempt/3"
            if timeout --signal=TERM --kill-after=30s 600s "$SDKMANAGER" --channel=3 \
              "platform-tools" \
              "platforms;android-37.0" \
              "build-tools;37.0.0" \
              "ndk;27.2.12479018" \
              "cmake;3.22.1"; then
              if sdk_ready; then
                echo "::endgroup::"
                break
              fi
              echo "::warning::SDK manager returned success but required components are incomplete."
            else
              echo "::warning::SDK download failed or timed out (attempt $attempt)."
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android SDK installation failed after 3 bounded attempts."
              exit 1
            fi
            # Remove only incomplete installation staging, never a complete SDK.
            if [ ! -f "$SDK_ROOT/cmake/3.22.1/source.properties" ]; then
              rm -rf -- "$SDK_ROOT/cmake/3.22.1"
            fi
            rm -rf -- "$SDK_ROOT/.temp"
            sleep $((attempt * 10))
          done

          sdk_ready || { echo "::error::Android SDK files incomplete."; exit 1; }
          "$SDK_ROOT/cmake/3.22.1/bin/cmake" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Kotlin/Java for CodeQL
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --rerun-tasks \
            :app:clean \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:java-kotlin"

  native:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXORA_GITHUB_CLIENT_ID: Iv1.NexoraCodeQLNative
      NEXORA_AUTH_BROKER_BASE_URL: https://codeql-native.example
      NEXORA_GITHUB_CALLBACK_URL: https://codeql-native.example/oauth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build native code for CodeQL
        shell: bash
        run: |
          cmake \
            -S native/git \
            -B build/codeql-native \
            -G Ninja \
            -DNEXORA_BUILD_NATIVE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/codeql-native --parallel 2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:c-cpp"

  broker:
    name: Analyze Go Auth Broker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: auth-broker/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: go
          build-mode: manual

      - name: Build broker for CodeQL
        working-directory: auth-broker
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:go"

  web:
    name: Analyze TypeScript/JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:javascript-typescript"
