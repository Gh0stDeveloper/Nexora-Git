name: VPS Installer CI

on:
  push:
    branches:
      - main
      - "feat/vps-*"
    paths:
      - "scripts/vps/**"
      - "auth-broker/compose.yaml"
      - ".github/workflows/vps-installer-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/vps/**"
      - "auth-broker/compose.yaml"
      - ".github/workflows/vps-installer-ci.yml"

permissions:
  contents: read

concurrency:
  group: vps-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate VPS installer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Bash syntax
        shell: bash
        run: bash -n scripts/vps/*.sh scripts/vps/nexora-git

      - name: Install ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        shell: bash
        run: shellcheck -x -P scripts/vps scripts/vps/*.sh scripts/vps/nexora-git

      - name: Test helper functions
        shell: bash
        run: bash scripts/vps/test-lib.sh

      - name: Test Android build helpers
        shell: bash
        run: bash scripts/vps/test-android-build-lib.sh

      - name: Test Android Signing Vault
        shell: bash
        run: bash scripts/vps/test-android-signing-lib.sh

      - name: Test Android background worker
        shell: bash
        run: bash scripts/vps/test-android-worker-lib.sh

      - name: Test Android artifact lifecycle
        shell: bash
        run: bash scripts/vps/test-android-artifacts-lib.sh

      - name: Test GitHub/VPS secret parity helpers
        shell: bash
        run: bash scripts/vps/test-android-github-lib.sh

      - name: Test autobuild and recovery operations
        shell: bash
        run: bash scripts/vps/test-android-ops-lib.sh

      - name: Test website VPS integration
        shell: bash
        run: bash scripts/vps/test-web-lib.sh

      - name: Validate Compose model
        shell: bash
        run: |
          cp auth-broker/.env.example auth-broker/.env
          (
            cd auth-broker
            docker compose config --quiet
          )
