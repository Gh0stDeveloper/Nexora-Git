name: Web CI

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and build website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Resolve reproducible npm lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload resolved npm lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nexora-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies from lockfile
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run typecheck

      - name: Build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://nexora-git.example
        run: npm run build
