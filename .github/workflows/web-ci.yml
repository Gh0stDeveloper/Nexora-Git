name: Web CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "phase-s/**"
    paths:
      - "web/**"
      - "docs/PRIVACY.md"
      - "scripts/ci/validate-privacy-sync.py"
      - "app/src/main/java/com/nexora/git/feature/settings/SettingsViewModel.kt"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and build website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Resolve reproducible npm lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload resolved npm lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nexora-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies from lockfile
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Privacy policy synchronization
        shell: bash
        run: python3 scripts/ci/validate-privacy-sync.py

      - name: Typecheck
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run typecheck

      - name: Build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://nexora-git.example
        run: npm run build

      - name: Validate production website output
        working-directory: web
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://nexora-git.example
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail

          FINGERPRINT='AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA'
          cat > "$RUNNER_TEMP/release.json" <<EOF
          {
            "versionName": "1.0.0-rc.1",
            "versionCode": 10000,
            "jobId": "20261007T040000Z-a1b2c3d4",
            "commit": "0123456789abcdef0123456789abcdef01234567",
            "signedAt": "2026-10-07T04:00:00Z",
            "sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "signingCertificateSha256": "$FINGERPRINT",
            "sizeBytes": 42000000,
            "downloadUrl": "/download/nexora-git.apk"
          }
          EOF

          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

          PORT=3000           HOSTNAME=127.0.0.1           NEXORA_WEB_RELEASE_METADATA="$RUNNER_TEMP/release.json"           node .next/standalone/server.js >"$RUNNER_TEMP/nexora-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null

          home="$(curl -fsS http://127.0.0.1:3000/)"
          privacy="$(curl -fsS http://127.0.0.1:3000/privacy)"
          verify="$(curl -fsS http://127.0.0.1:3000/verify)"
          robots="$(curl -fsS http://127.0.0.1:3000/robots.txt)"
          sitemap="$(curl -fsS http://127.0.0.1:3000/sitemap.xml)"
          headers="$(curl -fsSI http://127.0.0.1:3000/)"

          grep -Fq 'https://nexora-git.example' <<<"$home"
          grep -Fq '"@type":"MobileApplication"' <<<"$home"
          grep -Fq '"softwareVersion":"1.0.0-rc.1"' <<<"$home"
          grep -Fq 'Privacy Policy' <<<"$privacy"
          grep -Fq "$FINGERPRINT" <<<"$verify"
          grep -Fq 'Sitemap: https://nexora-git.example/sitemap.xml' <<<"$robots"
          grep -Fq 'https://nexora-git.example/privacy' <<<"$sitemap"
          grep -Fq 'https://nexora-git.example/verify' <<<"$sitemap"

          if grep -qi '^x-powered-by:' <<<"$headers"; then
            echo "Next.js server disclosure header is present." >&2
            exit 1
          fi

          if grep -Rqs 'nexora-git\.invalid' .next/standalone .next/static; then
            echo "Deprecated .invalid production fallback leaked into build output." >&2
            exit 1
          fi
