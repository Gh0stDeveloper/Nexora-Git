name: Android Performance Qualification

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Baseline Profile and startup benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NEXORA_GITHUB_CLIENT_ID: Iv1.NexoraPerformance
      NEXORA_AUTH_BROKER_BASE_URL: https://performance.example
      NEXORA_GITHUB_CALLBACK_URL: https://performance.example/oauth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Generate profile and run startup benchmark
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:generateBaselineProfile
            ./gradlew --no-daemon :baselineprofile:connectedBenchmarkAndroidTest

      - name: Upload performance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NexoraGit-performance-${{ github.ref_name }}
          path: |
            app/src/**/generated/baselineProfiles/**
            baselineprofile/build/outputs/**
            baselineprofile/build/reports/**
          if-no-files-found: warn
          retention-days: 30
