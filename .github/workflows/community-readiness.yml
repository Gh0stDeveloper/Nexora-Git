name: Community Readiness

on:
  push:
    branches:
      - main
      - "phase-*"
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "docs/GITHUB_REPOSITORY_SETTINGS.md"
      - "docs/assets/screenshots/**"
      - "scripts/ci/validate-s16-discoverability.py"
      - "scripts/ci/validate-github-launch-settings.sh"
      - "scripts/github/apply-launch-settings.sh"
      - ".github/workflows/community-readiness.yml"
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "docs/GITHUB_REPOSITORY_SETTINGS.md"
      - "docs/assets/screenshots/**"
      - "scripts/ci/validate-s16-discoverability.py"
      - "scripts/ci/validate-github-launch-settings.sh"
      - "scripts/github/apply-launch-settings.sh"
      - ".github/workflows/community-readiness.yml"

permissions:
  contents: read

jobs:
  repository-presentation:
    name: Validate repository presentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate administration scripts
        shell: bash
        run: |
          bash -n scripts/ci/validate-github-launch-settings.sh
          bash -n scripts/github/apply-launch-settings.sh

      - name: Validate S.16 repository assets
        shell: bash
        run: python3 scripts/ci/validate-s16-discoverability.py
