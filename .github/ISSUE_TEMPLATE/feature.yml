name: Feature request
description: Propose a focused improvement to Nexora Git
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep requests focused on the Android Git/GitHub workspace. Security issues belong in the private vulnerability-reporting flow described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow gap
      description: What developer workflow is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-facing result rather than prescribing an implementation when possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Product area
      options:
        - Local Git
        - GitHub integration
        - Editor/code browser
        - Repository/workspace management
        - Automation/releases
        - UX/accessibility/localization
        - Self-hosting/Auth Broker
        - Website/distribution
        - Other
    validations:
      required: true
