version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    groups:
      android-runtime:
        patterns:
          - "androidx.*"
          - "com.android.*"
          - "com.google.dagger*"
          - "com.google.devtools.ksp*"
      networking:
        patterns:
          - "com.squareup.*"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    groups:
      web-runtime:
        dependency-type: "production"
      web-development:
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/auth-broker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      broker:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/auth-broker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore"
      include: "scope"
